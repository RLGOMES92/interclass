<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interclasse Porto Seguro 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #06080c; color: #E2E8F0; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .tab-content { display: none; }
        .active-tab { display: block; animation: fadeIn 0.4s ease-out; }
        .nav-active { color: #00F5FF; border-top: 3px solid #00F5FF; background: rgba(0, 245, 255, 0.05); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .status-futuro { border-left: 4px solid #475569; }
        .status-concluido { border-left: 4px solid #FF007F; background: rgba(255, 0, 127, 0.05); }
        .gol-entry { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(-10px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ESTILO JORNAL */
        .font-serif-display { font-family: 'Playfair Display', serif; }
        .jornal-container { border: 2px solid rgba(255, 255, 255, 0.1); background: #111827; border-radius: 1.5rem; overflow: hidden; margin-bottom: 2.5rem; }
        .jornal-header { background: linear-gradient(135deg, #FF007F 0%, #3b82f6 100%); padding: 12px; text-align: center; }
        .manchete { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; color: #fff; text-transform: uppercase; line-height: 1.1; padding: 20px; text-align: center; letter-spacing: -0.02em; }
        .destaque-card { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 20px; }
        @media (min-width: 640px) { .destaque-card { flex-direction: row; justify-content: center; } }
        .player-avatar { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #FF007F 0%, #3b82f6 100%); display: flex; align-items: center; justify-content: center; color: white; font-size: 40px; border: 4px solid #fff; box-shadow: 0 0 20px rgba(255, 0, 127, 0.3); }
        .speech-bubble { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 20px; position: relative; font-style: italic; color: #e2e8f0; }
        .speech-bubble::before { content: ''; position: absolute; width: 15px; height: 15px; background: #111827; border-left: 1px solid rgba(255,255,255,0.1); border-bottom: 1px solid rgba(255,255,255,0.1); bottom: 20px; left: -8px; transform: rotate(45deg); }
    </style>
</head>
<body class="pb-32">
    <header class="p-6 text-center bg-[#111827] border-b border-white/10 shadow-2xl">
        <h1 class="text-2xl font-black text-[#FF007F] italic uppercase tracking-tighter">Interclasse 7º Ano</h1>
        <p class="text-[10px] text-cyan-400 font-mono tracking-[0.3em] mt-1 uppercase">Coordenação: Rodrigo Gomes</p>
    </header>

    <main class="max-w-xl mx-auto p-4">
        <section id="jogos" class="tab-content active-tab">
            <div id="jornal-area" class="hidden"></div>
            <h2 class="text-xl font-bold mb-6 text-center uppercase tracking-widest"><i class="fas fa-calendar-day text-pink-500 mr-2"></i> Jogos</h2>
            <div id="lista-jogos" class="space-y-4"></div>
        </section>

        <section id="tabela" class="tab-content">
            <h2 class="text-xl font-bold mb-6 text-center uppercase tracking-widest"><i class="fas fa-trophy text-yellow-500 mr-2"></i> Classificação</h2>
            <div class="glass rounded-xl overflow-hidden mb-6">
                <table class="w-full text-sm">
                    <thead class="bg-white/5 text-gray-400 text-[10px] uppercase">
                        <tr><th class="p-4 text-left">Time</th><th class="p-4 text-center">Pts</th><th class="p-4 text-center">Vit</th><th class="p-4 text-center">SG</th></tr>
                    </thead>
                    <tbody id="tabela-body" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </section>
                <section id="stats" class="tab-content">
            <h2 class="text-xl font-bold mb-6 text-center uppercase tracking-widest"><i class="fas fa-chart-line text-cyan-400 mr-2"></i> Líderes</h2>
            <div class="space-y-6">
                <div class="glass p-4 rounded-2xl">
                    <h3 class="text-xs font-black text-cyan-400 uppercase mb-3">⚽ Artilharia</h3>
                    <div id="rank-artilheiros" class="space-y-2"></div>
                </div>
                <div class="glass p-4 rounded-2xl">
                    <h3 class="text-xs font-black text-pink-500 uppercase mb-3">🧤 Goleiros</h3>
                    <div id="rank-goleiros" class="space-y-2"></div>
                </div>
            </div>
        </section>

        <section id="admin" class="tab-content">
            <div id="login-section" class="glass p-8 rounded-2xl text-center">
                <input type="password" id="senha" class="w-full p-4 bg-black/40 rounded-xl border border-white/10 mb-4 text-center text-white" placeholder="Senha">
                <button onclick="login()" class="w-full bg-cyan-600 p-4 rounded-xl font-black uppercase text-xs">Acessar Painel</button>
            </div>
            
            <div id="painel" class="hidden space-y-6">
                <div class="glass p-6 rounded-2xl border-t-4 border-yellow-500">
                    <h3 class="font-bold mb-4 text-xs uppercase text-yellow-500 text-center">🗞️ Editar Jornal</h3>
                    <div class="space-y-3">
                        <input type="text" id="adm-manchete" placeholder="Manchete" class="w-full bg-slate-900 p-3 rounded-xl text-xs text-white">
                        <input type="text" id="adm-jogador" placeholder="Nome do Atleta" class="w-full bg-slate-900 p-3 rounded-xl text-xs text-white">
                        <input type="text" id="adm-sala" placeholder="Sala" class="w-full bg-slate-900 p-3 rounded-xl text-xs text-white">
                        <textarea id="adm-entrevista" placeholder="Entrevista" class="w-full bg-slate-900 p-3 rounded-xl text-xs text-white h-24"></textarea>
                        <button onclick="salvarNoticia()" class="w-full bg-yellow-600 p-3 rounded-xl font-black uppercase text-xs">Publicar No Jornal</button>
                    </div>
                </div>

                <div class="glass p-6 rounded-2xl border-t-4 border-pink-500">
                    <h3 class="font-bold mb-4 text-xs uppercase text-pink-500 text-center">Lançar Placar</h3>
                    <select id="adm-jogo-id" onchange="carregarJogo()" class="w-full mb-4 bg-slate-900 p-3 rounded-xl text-xs text-white"></select>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <input type="number" id="adm-g1" placeholder="Gols T1" class="w-full bg-slate-900 p-3 rounded-xl text-center text-white">
                        <input type="number" id="adm-g2" placeholder="Gols T2" class="w-full bg-slate-900 p-3 rounded-xl text-center text-white">
                    </div>
                    <div id="gols-t1-container" class="space-y-2"></div>
                    <button onclick="addGol(1)" class="w-full my-2 bg-cyan-600/20 p-2 rounded-xl text-[10px] uppercase font-bold">+ Artilheiro T1</button>
                    <div id="gols-t2-container" class="space-y-2"></div>
                    <button onclick="addGol(2)" class="w-full my-2 bg-pink-600/20 p-2 rounded-xl text-[10px] uppercase font-bold">+ Artilheiro T2</button>
                    <button onclick="salvarPartida()" class="w-full bg-[#FF007F] p-4 rounded-xl font-black uppercase text-xs mt-4">💾 Salvar Partida</button>
                </div>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-0 w-full bg-[#0F172A]/95 backdrop-blur-xl border-t border-white/10 flex justify-around p-3 z-50">
        <button onclick="muda('jogos', this)" class="nav-active flex flex-col items-center p-2 text-gray-500"><i class="fas fa-calendar-day"></i><span class="text-[8px] uppercase mt-1">Jogos</span></button>
        <button onclick="muda('tabela', this)" class="flex flex-col items-center p-2 text-gray-500"><i class="fas fa-chart-bar"></i><span class="text-[8px] uppercase mt-1">Tabela</span></button>
        <button onclick="muda('stats', this)" class="flex flex-col items-center p-2 text-gray-500"><i class="fas fa-star"></i><span class="text-[8px] uppercase mt-1">Líderes</span></button>
        <button onclick="muda('admin', this)" class="flex flex-col items-center p-2 text-gray-500"><i class="fas fa-user-lock"></i><span class="text-[8px] uppercase mt-1">Admin</span></button>
    </nav>
        <script>
        const JOGOS_DATA = [
            {id:0, t1:"Pebas. Fc", t2:"Deby e Loide", data:"24/03 Mar"},
            {id:1, t1:"7 cb2", t2:"Complexo do broa", data:"30/03 Seg"},
            {id:2, t1:"Chapeuzinho", t2:"Dominance", data:"31/03 Mar"},
            {id:3, t1:"Pebas. Fc", t2:"7 cb2", data:"06/04 Seg"},
            {id:4, t1:"Deby e Loide", t2:"Chapeuzinho", data:"07/04 Mar"},
            {id:5, t1:"Complexo do broa", t2:"Dominance", data:"13/04 Seg"},
            {id:6, t1:"Pebas. Fc", t2:"Complexo do broa", data:"14/04 Mar"},
            {id:7, t1:"7 cb2", t2:"Chapeuzinho", data:"20/04 Seg"},
            {id:8, t1:"Deby e Loide", t2:"Dominance", data:"21/04 Mar"},
            {id:9, t1:"Pebas. Fc", t2:"Chapeuzinho", data:"27/04 Seg"},
            {id:10, t1:"7 cb2", t2:"Dominance", data:"28/04 Mar"},
            {id:11, t1:"Deby e Loide", t2:"Complexo do broa", data:"04/05 Seg"},
            {id:12, t1:"Pebas. Fc", t2:"Dominance", data:"05/05 Mar"},
            {id:13, t1:"7 cb2", t2:"Deby e Loide", data:"11/05 Seg"},
            {id:14, t1:"Complexo do broa", t2:"Chapeuzinho", data:"12/05 Mar"}
        ];

        let db = JSON.parse(localStorage.getItem('inter_2026_master_v1')) || {
            times: ["Pebas. Fc","7 cb2","Deby e Loide","Complexo do broa","Chapeuzinho","Dominance"].map(n => ({nome:n, pts:0, v:0, gp:0, gc:0})),
            jogos: JOGOS_DATA.map(j => ({...j, g1:null, g2:null, golsT1:[], golsT2:[]})),
            noticia: null
        };

        function login() {
            if (document.getElementById('senha').value === 'tina1904') {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('painel').classList.remove('hidden');
                populaSelect();
            }
        }

        function muda(id, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            document.getElementById(id).classList.add('active-tab');
            btn.classList.add('nav-active');
            window.scrollTo(0,0);
        }

        function salvarNoticia() {
            db.noticia = {
                manchete: document.getElementById('adm-manchete').value,
                jogador: document.getElementById('adm-jogador').value,
                sala: document.getElementById('adm-sala').value,
                entrevista: document.getElementById('adm-entrevista').value
            };
            atualiza();
            alert("Jornal Atualizado!");
        }

        function renderJornal() {
            const area = document.getElementById('jornal-area');
            if (db.noticia) {
                area.classList.remove('hidden');
                area.innerHTML = `
                <div class="jornal-container border-pink-500/30 border shadow-2xl">
                    <div class="jornal-header"><span class="text-white font-black text-[10px] uppercase italic">Exclusivo: Destaque da Rodada</span></div>
                    <div class="manchete font-serif-display">${db.noticia.manchete}</div>
                    <div class="destaque-card">
                        <div class="flex flex-col items-center">
                            <div class="player-avatar">${db.noticia.jogador.charAt(0).toUpperCase()}</div>
                            <p class="font-bold text-white mt-2 uppercase text-sm">${db.noticia.jogador}</p>
                            <p class="text-[9px] text-pink-500 font-bold uppercase">Sala ${db.noticia.sala}</p>
                        </div>
                        <div class="speech-bubble flex-1">"${db.noticia.entrevista}"</div>
                    </div>
                </div>`;
            }
        }

        function addGol(time, nome="", sala="") {
            const div = document.createElement('div');
            div.className = 'gol-entry';
            div.innerHTML = `<input type="text" value="${nome}" placeholder="Nome" class="gol-nome flex-1 bg-slate-800 p-2 rounded-lg text-xs text-white">
                             <input type="text" value="${sala}" placeholder="Sala" class="gol-sala w-12 bg-slate-800 p-2 rounded-lg text-xs text-white">
                             <button onclick="this.parentElement.remove()" class="text-red-500 px-2">✕</button>`;
            document.getElementById(`gols-t${time}-container`).appendChild(div);
        }

        function populaSelect() {
            document.getElementById('adm-jogo-id').innerHTML = db.jogos.map(j => `<option value="${j.id}">${j.g1 !== null ? '✅' : '⏳'} ${j.t1} x ${j.t2}</option>`).join('');
            carregarJogo();
        }

        function carregarJogo() {
            const id = document.getElementById('adm-jogo-id').value;
            const jogo = db.jogos.find(j => j.id == id);
            document.getElementById('adm-g1').value = jogo.g1;
            document.getElementById('adm-g2').value = jogo.g2;
            document.getElementById('gols-t1-container').innerHTML = "";
            document.getElementById('gols-t2-container').innerHTML = "";
            jogo.golsT1.forEach(g => addGol(1, g.nome, g.sala));
            jogo.golsT2.forEach(g => addGol(2, g.nome, g.sala));
        }

        function salvarPartida() {
            const id = document.getElementById('adm-jogo-id').value;
            const jogo = db.jogos.find(j => j.id == id);
            jogo.g1 = parseInt(document.getElementById('adm-g1').value);
            jogo.g2 = parseInt(document.getElementById('adm-g2').value);
            jogo.golsT1 = Array.from(document.getElementById('gols-t1-container').querySelectorAll('.gol-entry')).map(e => ({nome: e.querySelector('.gol-nome').value, sala: e.querySelector('.gol-sala').value}));
            jogo.golsT2 = Array.from(document.getElementById('gols-t2-container').querySelectorAll('.gol-entry')).map(e => ({nome: e.querySelector('.gol-nome').value, sala: e.querySelector('.gol-sala').value}));
            atualiza();
            alert("Salvo com sucesso!");
        }

        function atualiza() {
            localStorage.setItem('inter_2026_master_v1', JSON.stringify(db));
            renderJornal();
            
            db.times.forEach(t => { t.pts = 0; t.v = 0; t.gp = 0; t.gc = 0; });
            let artilharia = {};

            db.jogos.forEach(j => {
                if(j.g1 === null) return;
                const t1 = db.times.find(t => t.nome === j.t1);
                const t2 = db.times.find(t => t.nome === j.t2);
                t1.gp += j.g1; t1.gc += j.g2;
                t2.gp += j.g2; t2.gc += j.g1;
                if(j.g1 > j.g2) { t1.pts += 3; t1.v += 1; }
                else if(j.g2 > j.g1) { t2.pts += 3; t2.v += 1; }
                else { t1.pts += 1; t2.pts += 1; }

                [...j.golsT1, ...j.golsT2].forEach(g => {
                    if(!g.nome) return;
                    artilharia[g.nome] = (artilharia[g.nome] || 0) + 1;
                });
            });

            document.getElementById('tabela-body').innerHTML = [...db.times].sort((a,b) => b.pts - a.pts || (b.gp-b.gc) - (a.gp-a.gc)).map(t => `
                <tr><td class="p-4 font-bold text-white uppercase text-xs">${t.nome}</td>
                <td class="p-4 text-center text-cyan-400 font-black">${t.pts}</td>
                <td class="p-4 text-center">${t.v}</td>
                <td class="p-4 text-center text-gray-500">${t.gp - t.gc}</td></tr>`).join('');

            document.getElementById('rank-artilheiros').innerHTML = Object.entries(artilharia).sort((a,b) => b[1] - a[1]).map(a => `
                <div class="flex justify-between uppercase font-bold text-[11px] border-b border-white/5 py-1">
                <span>${a[0]}</span><span class="text-cyan-400">${a[1]} Gols</span></div>`).join('');

            document.getElementById('lista-jogos').innerHTML = db.jogos.map(j => `
                <div class="glass p-4 rounded-xl ${j.g1 !== null ? 'status-concluido' : 'status-futuro'}">
                    <div class="flex justify-between items-center text-center font-black uppercase text-[10px]">
                        <div class="w-1/3">${j.t1}</div>
                        <div class="w-1/3 text-lg">${j.g1 !== null ? j.g1+' x '+j.g2 : '<span class="text-[8px] block text-gray-500">'+j.data+'</span>VS'}</div>
                        <div class="w-1/3">${j.t2}</div>
                    </div>
                </div>`).join('');
        }

        window.onload = atualiza;
    </script>
</body>
</html>
